<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catálogo interativo de produtos em português.">
  <title>Vitrine | Catálogo de Produtos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <div class="container topo-conteudo">
      <a class="marca" href="#" aria-label="Vitrine - página inicial"><span class="marca-icone">V</span> vitrine</a>
      <nav aria-label="Navegação principal">
        <button class="nav-btn ativo" id="btnTodos">Todos os produtos</button>
        <button class="nav-btn" id="btnFavoritos">♡ Favoritos <span id="contadorFavoritos">0</span></button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="apresentacao">
      <div>
        <p class="sobretitulo">CATÁLOGO DIGITAL</p>
        <h1>Encontre o que combina<br>com você.</h1>
        <p class="subtitulo">Explore produtos, confira detalhes e salve seus favoritos.</p>
      </div>
      <div class="selo">✦ <span>Uma seleção para você</span></div>
    </section>

    <section class="ferramentas" aria-label="Pesquisa e filtros">
      <form id="formPesquisa" class="pesquisa">
        <span aria-hidden="true">⌕</span>
        <input id="campoPesquisa" type="search" placeholder="Buscar produto pelo nome..." aria-label="Buscar produto pelo nome">
        <button type="submit">Buscar</button>
      </form>
      <label class="filtro-label" for="filtroCategoria">Categoria</label>
      <select id="filtroCategoria">
        <option value="todas">Todas as categorias</option>
      </select>
    </section>

    <div class="linha-resultados">
      <h2 id="tituloLista">Produtos em destaque</h2>
      <p id="quantidadeProdutos"></p>
    </div>

    <div id="mensagem" class="mensagem" role="status">Carregando produtos...</div>
    <section id="gradeProdutos" class="grade" aria-live="polite"></section>
  </main>

  <footer><div class="container rodape"><span>Vitrine — Catálogo de produtos</span><span>Projeto acadêmico • HTML, CSS e JavaScript</span></div></footer>

  <dialog id="modalDetalhes" class="modal">
    <button class="fechar" id="fecharModal" aria-label="Fechar">×</button>
    <div id="conteudoDetalhes"></div>
  </dialog>
  <script src="script.js"></script>
</body>
</html>
